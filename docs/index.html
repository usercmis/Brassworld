<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f5edd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Brassworld — An Industrial Atlas</title>

<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/theme/atlas.css">
<script type="module" src="/theme/english.js"></script>
</head>
<body>
<a class="skip-link" href="#mapbtns">Skip to game controls</a>
<svg width="0" height="0" style="position:absolute"><defs id="symbols"></defs></svg>
<div id="app">
  <header id="top">
    <div class="brand">Brassworld</div>
    <span class="chip" id="eraChip">—</span>
    <span class="meta" id="roundInfo"></span>
    <span class="pips" id="pips" title="Actions remaining this turn"></span>
    <span class="spacer"></span>
    <button id="btnMusic" class="musicbtn" title="Background music (M)" aria-label="Background music">♪</button>
    <nav id="menu">
      <button id="btnNew" class="primary">New game</button>
      <button id="btnHelp">How to play</button>
      <button id="btnSettings">Settings</button>
    </nav>
    <button id="btnMenu" class="iconbtn" aria-label="Menu">☰</button>
  </header>

  <section id="infobar">
    <div id="players"></div>
    <div id="markets" class="markets"></div>
  </section>

  <main id="mapwrap">
    <svg id="map" role="img" aria-label="World map. Browse and select locations from the city list." aria-describedby="cityHelp"></svg>
    <div id="hint" class="hide"></div>
    <div id="mapbtns" tabindex="-1">
      <button id="btnWorld" title="World view (F)">World</button>
      <button id="btnHome" title="Go to your home region (H)">Home</button>
      <button id="btnNet" title="Show your network and cities where you can build">Network</button>
      <button id="btnMine" title="Highlight your industries (I)">My industries</button>
      <button id="btnLog" title="Game journal">Journal</button>
    </div>
    <details id="cityNavigator">
      <summary>City list</summary>
      <p class="city-help" id="cityHelp">Choose a city to inspect its location or filter available actions.</p>
      <h3 class="city-section-title">Cities</h3>
      <div id="cityList" role="group" aria-label="City list"></div>
      <h3 class="city-section-title">Available links</h3>
      <div id="linkList" role="group" aria-label="Available links"></div>
    </details>
    <div id="tip" class="hide"></div>
    <aside id="logpanel" class="hide"><div class="lp-head">Game journal<button class="x" id="logClose">✕</button></div><div id="log"></div></aside>
    <div id="actfeed"></div>
    <div id="playbar" class="hide"><span id="playwho" role="status" aria-live="polite" aria-atomic="true"></span><span class="spacer"></span>
      <button id="btnSkip" title="Skip the remaining replay and view the result (Esc)">Skip ▸▸</button></div>
    <div id="banner" class="hide"></div>
  </main>

  <footer id="dock">
    <div id="sheetHandle"><span></span></div>
    <div id="sheetTabs">
      <button data-pane="hand" class="on">Hand</button>
      <button data-pane="act">Actions<b id="actCount"></b></button>
      <button data-pane="mat">Tiles</button>
      <button data-pane="mkt">Market</button>
      <button data-pane="log">Journal</button>
    </div>
    <section id="handPane" class="pane on" data-pane="hand">
      <div class="sec">Hand <span class="sub" id="handSub"></span></div>
      <div id="cards"></div>
    </section>
    <section id="actPane" class="pane" data-pane="act">
      <div id="acttabs"></div>
      <div id="confirm" class="hide"></div>
      <div id="actlist"></div>
    </section>
    <section id="matPane" class="pane" data-pane="mat">
      <div class="sec">Next industry tile <button id="btnMat" class="mini">All tiles</button></div>
      <div id="mat"></div>
    </section>
    <section id="mktPane" class="pane mobile-only" data-pane="mkt"><div id="markets2" class="markets"></div></section>
    <section id="logPane" class="pane mobile-only" data-pane="log"><div id="log2"></div></section>
  </footer>
</div>
<div id="cardpop" class="hide"></div>
<div id="fx"></div>
<div id="toasts" role="status" aria-live="polite" aria-relevant="additions text" aria-atomic="false"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
